<mat-dialog-content>
    <main class="main-content">
        <div class="form-container container-fluid">
            <div class="form-header mb-4">
                <h1>Editar Inmueble</h1>
            </div>

            <div class="form-cardx">
                <form [formGroup]="inmuebleForm">
                    <div class="form-section">
                        <div class="form-section-title">Información del Inmueble</div>

                        <div class="row row-cols-1 row-cols-md-3 g-3">
                            <div class="col">
                                <div class="form-group">
                                    <label for="numeroCasa">Número de Casa <span class="mensaje-error">*</span></label>
                                    <input type="text" id="numeroCasa" formControlName="numeroCasa"
                                        placeholder="Ej. A99" />
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="idubicacion">Sección</label>
                                    <select id="idubicacion" formControlName="idubicacion">
                                        <option value="null" disabled>Seleccione una ubicación</option>
                                        @for (ubicacion of ubicaciones; track ubicacion.id) {
                                        <option [value]="ubicacion.id">
                                            {{ ubicacion.nombreUbicacion }}
                                        </option>
                                        }
                                    </select>
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="cuotaDeMantenimientoBase">Cuota de Mantenimiento</label>
                                    <div class="input-wrapper has-prefix">
                                        <span class="input-prefix">$</span>
                                        <input type="number" id="cuotaDeMantenimientoBase"
                                            formControlName="cuotaDeMantenimientoBase" step="0.01" placeholder="0.00" />
                                    </div>
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="estadoOcupacion">Estado de Ocupación</label>
                                    <select id="estadoOcupacion" formControlName="estadoOcupacion">
                                        <option [value]="-1" disabled selected>Seleccione un estado</option>
                                        @for (estado of estadosOcupacion; track estado.id) {
                                        <option [value]="estado.id">
                                            {{ estado.estadoInicialOcupacion }}
                                        </option>
                                        }
                                    </select>
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="numeroHabitantes">Número de Habitantes</label>
                                    <input type="number" id="numeroHabitantes" formControlName="numeroHabitantes"
                                        placeholder="0" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-section-title">Datos del Titular / Propietario</div>
                        <div class="row row-cols-1 row-cols-md-3 g-3">
                            <div class="col">
                                <div class="form-group">
                                    <label for="nombreTitular">Nombre(s)</label>
                                    <input type="text" id="nombreTitular" formControlName="nombreTitular" />
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="apellidosTitular">Apellidos</label>
                                    <input type="text" id="apellidosTitular" formControlName="apellidosTitular" />
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="celularTitular">Celular</label>
                                    <input type="tel" id="celularTitular" formControlName="celularTitular"
                                        placeholder="Ej. 5534567890" />
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="emailTitular">Correo Electrónico</label>
                                    <input type="email" id="emailTitular" formControlName="emailTitular"
                                        placeholder="titular@correo.com" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-section-title">Datos del Ocupante (Si aplica)</div>
                        <div class="row row-cols-1 row-cols-md-3 g-3">
                            <div class="col">
                                <div class="form-group">
                                    <label for="nombreOcupante">Nombre(s)</label>
                                    <input type="text" id="nombreOcupante" formControlName="nombreOcupante" />
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="apellidosOcupante">Apellidos</label>
                                    <input type="text" id="apellidosOcupante" formControlName="apellidosOcupante" />
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="celularOcupante">Celular</label>
                                    <input type="tel" id="celularOcupante" formControlName="celularOcupante"
                                        placeholder="Ej. 5534567890" />
                                </div>
                            </div>

                            <div class="col">
                                <div class="form-group">
                                    <label for="emailOcupante">Correo Electrónico</label>
                                    <input type="email" id="emailOcupante" formControlName="emailOcupante"
                                        placeholder="ocupante@correo.com" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div class="form-section-title">Adicionales</div>
                        <div class="row">
                            <div class="col-12">
                                <div class="form-group">
                                    <label for="observaciones">Observaciones</label>
                                    <textarea id="observaciones" formControlName="observaciones" rows="3"
                                        placeholder="Notas o comentarios relevantes..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button (click)="cancelar()">Cancelar</button>
    <button mat-raised-button (click)="mostrarConfirmacion()" color="primary">Actualizar Datos</button>
</mat-dialog-actions>

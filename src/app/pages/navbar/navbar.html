<aside class="sidebar">
    <div>
        <div class="brand">
            <!-- <div class="brand-icon"></div> -->
            <span>🏡 Casa Blanca</span>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">📊 Resumen Analítico</a></li>
            <li class="menu-item"><a routerLink="/ingresos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">💰 Registro de Ingresos</a></li>
            <li class="menu-item"><a routerLink="/egresos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">💸 Control de Egresos</a></li>
            <li class="menu-item"><a routerLink="/inmuebles" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">🏡 Gestión de Inmuebles</a></li>
            <!-- <li class="menu-item"><a routerLink="/eventos/eventosingresos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">🥳 Eventos Ingresos</a></li> -->

            <li class="menu-item menu-item-has-children" [class.open]="isSubmenuOpen()">
                <!-- Botón principal -->
                <a href="#" (click)="toggleSubmenu($event)">
                    🥳 Eventos
                </a>

                <!-- Nuevo control de flujo nativo de Angular -->
                @if (isSubmenuOpen()) {
                <ul class="sub-menu">
                    <li class="menu-item">
                        <a routerLink="/eventos/eventosingresos" routerLinkActive="active">
                            💸 Ingresos
                        </a>
                    </li>
                    <li class="menu-item">
                        <a routerLink="/eventos/eventosegresos" routerLinkActive="active">
                            💷 Egresos
                        </a>
                    </li>
                </ul>
                }
            </li>
            <!-- <li class="menu-item"><a routerLink="/eventos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">🎂 Eventos Egresos</a></li> -->
             <li class="menu-item"><a routerLink="/usuarios" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">🧑 Usuarios</a></li>
            <li class="menu-item "><a routerLink="/login">🚪 Salir</a></li>

        </ul>
    </div>

    <div class="user-profile">
        <div class="avatar">🏡</div>
        <div class="user-info">
            <span class="username">Ana Martínez</span>
            <span class="role">Administradora</span>
        </div>
    </div>
</aside>

<mat-dialog-content>
    <!-- CONTENIDO DE CAPTURA -->
    <main class="main-content">
        <div class="form-container">

            <h3>Nuevo Registro de Ingresos</h3>

            <!-- TARJETA DEL FORMULARIO -->
            <form class="form-card" onsubmit="event.preventDefault();">

                <div class="form-section">
                    
                    <!-- <div class="form-section-title">Información General</div> -->

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="concepto">Concepto / Descripción</label>
                            <input type="text" id="concepto"
                                placeholder="Ej. Cuota mantenimiento extraordinario, Pago de insumos..." required>
                        </div>

                        <div class="form-group">
                            <label for="referencia">Casa</label>
                            <!-- <input type="text" id="referencia" placeholder="Ej. Unidad 14-B, Proveedor CF-2" required> -->
                            <select id="Casa">
                                <option value="mantenimiento">Casa 1</option>
                                <option value="extraordinaria">Casa 2</option>
                                <option value="amenidades">Casa 3</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha">Fecha de Operación</label>
                            <input type="date" id="fecha" required>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN 3: DETALLES FINANCIEROS -->
                <div class="form-section">
                    <div class="form-section-title">Datos Financieros</div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="categoria">Categoría</label>
                            <select id="categoria">
                                <option value="all">Todos los conceptos</option>
                                <option value="mantenimiento">Cuotas de Mantenimiento</option>
                                <option value="extraordinaria">Cuotas Extraordinarias</option>
                                <option value="amenidades">Reserva de Amenidades</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="monto">Monto Neto</label>
                            <div class="amount-input-wrapper">
                                <span class="amount-prefix">$</span>
                                <input type="number" id="monto" step="0.01" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label for="notas">Observaciones Adicionales</label>
                            <textarea id="notas"
                                placeholder="Detalles internos opcionales sobre la transacción..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- BOTONES DE ENVÍO -->
                <!-- <div class="form-actions">
                    <button type="button" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Registro</button>
                </div> -->

            </form>
        </div>
    </main>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-raised-button [mat-dialog-close]="false">Cancelar</button>
    <button mat-raised-button [mat-dialog-close]="true" class="btn-confirm" cdkFocusInitial>Guardar Registro</button>
</mat-dialog-actions>

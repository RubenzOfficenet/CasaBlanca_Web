<div class="principal">
    <div class="login-container">
        <!-- ENCABEZADO E IDENTIDAD -->
        <div class="brand-header">
            <div class="brand-logo">
            <!-- <div class="brand-icon"></div> -->
            <span>🏠 Casa Blanca</span>
        </div>
        <h1>Control de Accesos</h1>
        <p>Ingresa tus credenciales de mesa de control</p>
    </div>

    <!-- FORMULARIO DE ACCESO -->
    <form class="login-form" #formulario="ngForm" (ngSubmit)="validarDatos(formulario)">

        <!-- Campo: Correo -->
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="nombre@oasisenterprise.com" required autocomplete="username" ngModel>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
            <div class="label-wrapper">
                <label for="password">Contraseña</label>
                <a href="#" class="forgot-link">¿La olvidaste?</a>
            </div>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" ngModel>
        </div>

        <!-- Opción: Recuérdame -->
        <!-- <div class="form-options">
            <input type="checkbox" id="remember-me">
            <label for="remember-me">Mantener sesión iniciada en este equipo</label>
        </div> -->

        <!-- Botón de Entrada -->
        <button type="submit" class="btn-submit">Iniciar Sesión de Operador</button>

    </form>

    <!-- ENLACE DE SOPORTE -->
    <!-- <div class="login-footer">
        ¿Problemas para ingresar? <a href="#">Contactar a Soporte TI</a>
    </div> -->

</div>
